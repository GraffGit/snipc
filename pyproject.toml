[project]
name = "snipc"
version = "0.1.0"
description = "Generate aesthetic code snippet cards straight from your terminal"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["cli", "code", "screenshot", "snippet", "syntax-highlighting"]
dependencies = [
    "typer>=0.12.0",
    "pygments>=2.17.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
snipc = "snipc.cli:app"


