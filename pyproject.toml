[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snipc"
version = "0.1.0"
description = "Generate aesthetic code snippet cards straight from your terminal"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "GraffGit" }]
requires-python = ">=3.10"
keywords = ["cli", "code", "screenshot", "snippet", "syntax-highlighting"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "pygments>=2.17.0",
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/GraffGit/snipc"
Repository = "https://github.com/GraffGit/snipc"
Issues = "https://github.com/GraffGit/snipc/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "build>=1.2.0",
]

[project.scripts]
snipc = "snipc.cli:app"



